function render(){index=normalize(index);pages.replaceChildren();const list=visible(index);list.forEach((n,i)=>pages.appendChild(makePage(n,list.length===2?(i?'right':'left'):'single')));count.textContent=list.length===2?'Pagine '+(index+1)+'–'+(index+2)+' / 8':'Pagina '+(index+1)+' / 8';prev.disabled=index===0;next.disabled=index===7;root.querySelectorAll('.toc button').forEach((b,i)=>b.setAttribute('aria-current',String(list.includes(i))))}
function stop(){clearInterval(timer);timer=null;play.textContent='▶ Riproduci';play.setAttribute('aria-pressed','false')}
async function go(n,manual=true){if(busy)return;if(manual)stop();n=normalize(Math.min(7,Math.max(0,n)));if(n===index)return;const old=index,dir=n>old?1:-1,oldList=visible(old);busy=true;index=n;render();if(!reduce.matches){const turning=document.createElement('div');turning.className='turn';const isSingle=oldList.length===1;turning.style.width=mq.matches?'100%':'50%';turning.style.left=mq.matches?'0':isSingle?'25%':dir>0?'50%':'0';turning.style.transformOrigin=dir>0?'left center':'right center';const im=document.createElement('img');im.src=PAGE_IMAGES[dir>0?oldList[oldList.length-1]:oldList[0]];im.alt='';turning.appendChild(im);stage.appendChild(turning);try{await turning.animate([{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY('+(-dir*150)+'deg)',opacity:0}],{duration:740,easing:'cubic-bezier(.25,.6,.2,1)'}).finished}catch(e){}turning.remove()}busy=false;if(index===7&&timer)stop()}
function step(dir,manual=true){const s=stops(),p=s.indexOf(normalize(index));return go(s[Math.max(0,Math.min(s.length-1,p+dir))],manual)}
prev.onclick=()=>step(-1);next.onclick=()=>step(1);play.onclick=()=>{if(timer){stop();return}if(index===7){index=0;render()}play.textContent='Ⅱ Pausa';play.setAttribute('aria-pressed','true');timer=setInterval(()=>step(1,false),5500)};
TITLES.forEach((title,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.setAttribute('aria-label','Pagina '+(i+1)+': '+title);b.onclick=()=>go(i);root.querySelector('.toc').appendChild(b)});
stage.addEventListener('pointerdown',e=>{if(e.isPrimary)start={x:e.clientX,y:e.clientY,id:e.pointerId}});stage.addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)step(dx<0?1:-1)});stage.addEventListener('pointercancel',()=>start=null);
function openZoom(n){stop();activeZoom=n;zoom.querySelector('img').src=PAGE_IMAGES[n];zoom.querySelector('img').alt=TITLES[n];zoom.hidden=false;zoom.scrollTop=0;zoom.scrollLeft=0;close.focus()}
zoomButton.onclick=()=>openZoom(index);pages.addEventListener('dblclick',e=>{const im=e.target.closest('img');if(im)openZoom(PAGE_IMAGES.indexOf(im.src))});close.onclick=()=>{zoom.hidden=true;zoomButton.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){zoom.hidden=true;stop();return}if(!zoom.hidden)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
full.onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{full.textContent='Usa l’orientamento orizzontale'}}catch(e){full.textContent='Schermo intero non disponibile'}};
document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'Esci da schermo intero':'Schermo intero');mq.addEventListener('change',()=>{stop();render()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
