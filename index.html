const TITLES=['Copertina','Due sedi. Un solo obiettivo.','Chi siamo','Aree di specializzazione','Fideiussioni per appalti pubblici','Costruzioni e immobili da costruire','Garanzie per i gestori ambientali','Brand e contatti'];
const root=document.getElementById('reader'),stage=root.querySelector('.stage'),pages=root.querySelector('.pages'),status=root.querySelector('.status'),prev=root.querySelector('.prev'),next=root.querySelector('.next');
const mq=matchMedia('(max-width:700px)'),reduce=matchMedia('(prefers-reduced-motion:reduce)');
let index=0,busy=false,start=null,suppressClickUntil=0;
function stops(){return mq.matches?[0,1,2,3,4,5,6,7]:[0,1,3,5,7]}
function normalize(n){return mq.matches?n:(n===0||n===7?n:n%2?n:n-1)}
function visible(n){return mq.matches||n===0||n===7?[n]:[n,n+1]}
function makePage(n,side){const el=document.createElement('div');el.className='page '+side;const im=document.createElement('img');im.src=PAGE_IMAGES[n];im.alt=(n+1)+'. '+TITLES[n];im.draggable=false;el.appendChild(im);return el}
function render(){index=normalize(index);pages.replaceChildren();const list=visible(index);list.forEach((n,i)=>pages.appendChild(makePage(n,list.length===2?(i?'right':'left'):'single')));status.textContent=list.length===2?'Pagine '+(index+1)+'–'+(index+2)+' di 8':'Pagina '+(index+1)+' di 8';prev.disabled=index===0;next.disabled=index===7}
async function go(n){if(busy)return;n=normalize(Math.min(7,Math.max(0,n)));if(n===index)return;const old=index,dir=n>old?1:-1,oldList=visible(old);busy=true;index=n;render();try{if(!reduce.matches){const turning=document.createElement('div');turning.className='turn';const single=oldList.length===1;turning.style.width=mq.matches?'100%':'50%';turning.style.left=mq.matches?'0':single?'25%':dir>0?'50%':'0';turning.style.transformOrigin=dir>0?'left center':'right center';const im=document.createElement('img');im.src=PAGE_IMAGES[dir>0?oldList[oldList.length-1]:oldList[0]];im.alt='';turning.appendChild(im);stage.appendChild(turning);try{await turning.animate([{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY('+(-dir*150)+'deg)',opacity:0}],{duration:1300,easing:'cubic-bezier(.3,.05,.2,1)'}).finished}catch(e){}finally{turning.remove()}}}finally{busy=false}}
function step(dir){const s=stops(),p=s.indexOf(normalize(index));return go(s[Math.max(0,Math.min(s.length-1,p+dir))])}
prev.onclick=()=>{if(Date.now()>=suppressClickUntil)step(-1)};next.onclick=()=>{if(Date.now()>=suppressClickUntil)step(1)};
stage.addEventListener('pointerdown',e=>{if(!e.isPrimary){start=null;return}start={x:e.clientX,y:e.clientY,id:e.pointerId}});
stage.addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4){suppressClickUntil=Date.now()+1450;step(dx<0?1:-1)}else if(Math.abs(dx)>12||Math.abs(dy)>12){suppressClickUntil=Date.now()+400}});
stage.addEventListener('pointercancel',()=>{start=null;suppressClickUntil=Date.now()+400});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
mq.addEventListener('change',()=>{start=null;render()});render();
</script></body></html>
